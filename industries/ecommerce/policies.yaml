- title: 退換貨
  content: 收到商品隔天起算七天內可以退貨,不需說明理由,也不用負擔任何費用(含退回運費)。為了檢查而拆封或試用一樣可以退,但商品若因此損壞,可能要負擔價值減損。少數不適用七天退貨的商品(例如客製刻字商品、已拆封的個人衛生用品)會在商品頁事先標示,沒有標示的都可以退。想換款式或尺寸,請在七天內退貨後重新下單。
- title: 退款
  content: 退貨商品驗收無誤後三到五個工作天退款,依原付款方式退回。
- title: 運費
  content: 滿 990 元免運,未滿 80 元。收到商品七天內退貨不收任何費用,退回的運費也不用您出。
- title: 發票
  content: 一律開立電子發票,出貨後寄到訂購時填的信箱。
- title: 個資
  content: 僅用於出貨與客服聯繫,不提供給第三方。可來信要求刪除。
