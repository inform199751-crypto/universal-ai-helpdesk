- title: 退換貨
  content: 收到商品隔天起算七天內可以退貨,不需說明理由,也不用負擔任何費用(含退回運費)。為了檢查而拆封或試用一樣可以退,但商品若因此損壞,可能要負擔價值減損。少數不適用七天退貨的商品(例如客製刻字商品、已拆封的個人衛生用品)會在商品頁事先標示,沒有標示的都可以退。想換款式或尺寸也可以換貨,收到商品七天內寄回原商品不用負擔任何費用,新商品的寄送請洽客服。
- title: 退款
  content: 收到退回的商品後三到五個工作天內退款,依原付款方式退回;依消保法,最晚在收到退回商品隔天起 15 天內退還。
- title: 運費
  content: 滿 990 元免運,未滿 80 元。收到商品七天內退貨不收任何費用,退回的運費也不用您出。
- title: 發票
  content: 一律開立電子發票,出貨後寄到訂購時填的信箱,也可以存入手機條碼載具或捐贈;需要紙本證明聯可以來信索取。退貨時,發票的作廢或折讓會先取得您的同意,再以電子方式辦理。
- title: 個資
  content: 僅用於出貨與客服聯繫,不提供給第三方。可以來信要求查詢、更正、停止寄送行銷訊息或刪除,我們會在法定期限內回覆;依法需要保存的資料可能無法刪除。
