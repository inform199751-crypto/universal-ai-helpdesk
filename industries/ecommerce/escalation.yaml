- level: L3
  category: safety
  trigger: 商品導致受傷、觸電、燙傷、送醫
  action: transfer
  script: 這件事我立刻升級給負責同仁處理,請您先留下方便聯繫的電話。
- level: L3
  category: legal
  trigger: 提告、律師、消保官、消保會、要上新聞、申訴
  action: transfer
  script: 這部分我請主管直接與您說明,請留下方便聯繫的時間與電話。
- level: L2
  category: money
  trigger: 重複扣款、多扣、刷了兩次、沒收到退款
  action: transfer
  script: 我幫您轉給帳務同仁核對刷卡紀錄,請提供訂單編號。
- level: L2
  category: privacy
  trigger: 個資、刪除我的資料、不要再寄信、退訂電子報
  action: transfer
  script: 我請專人協助您處理個資相關的申請,會在三個工作天內回覆您。
- level: L1
  category: service
  trigger: 出貨太慢、包裝不用心、客服回太慢
  action: apologize
  script: 很抱歉這次的經驗讓您失望,我會把您的意見轉給倉儲與客服同仁。
