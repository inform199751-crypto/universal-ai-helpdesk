- q: 下單後多久出貨
  a: 平日下午三點前下單當天寄出,之後的隔一個工作天。週六日不出貨。
- q: 運費怎麼算
  a: 滿 990 元免運,未滿收 80 元。超商取貨一律 60 元。
- q: 可以退貨嗎
  a: 可以,收到商品隔天起算七天內都能退貨(依規定可排除、且商品頁事先標示的少數商品除外),不用說明理由,也不用負擔任何費用,退回的運費也包含在內。
- q: 拆封或用過還能退嗎
  a: 七天內為了檢查商品而拆封、試用,一樣可以退貨。只是商品如果因此損壞,可能需要負擔部分的價值減損。
- q: 哪些商品不能七天內退貨
  a: 少數商品依規定可以不適用七天退貨,例如依您要求客製刻字的商品、已經拆封的個人衛生用品。這類商品都會在商品頁事先標示,沒有標示的就可以退。
- q: 可以選超商取貨嗎
  a: 可以,結帳時選取貨門市即可。包裹到店會由超商發簡訊通知,請在通知寫的期限內領取。
- q: 退款多久會到帳
  a: 收到您退回的商品後,三到五個工作天內依原付款方式退款,最晚不超過消保法規定的 15 天。信用卡退刷的入帳時間由發卡銀行決定。
- q: 刷卡付款的訂單也能退嗎
  a: 可以,刷卡付款一樣在收到商品隔天起算七天內都能退貨,款項會刷退回原本的信用卡。
- q: 發票怎麼拿
  a: 一律開立電子發票,出貨後寄到您訂購時填寫的信箱,需要紙本證明聯(例如報帳)可以來信索取。需要統編請在下單備註欄填寫。
- q: 可以存手機載具或捐贈發票嗎
  a: 可以,結帳時填手機條碼載具,發票就會存進載具。想捐贈的話,結帳時填受贈單位的捐贈碼就好。
- q: 想買的東西缺貨了怎麼辦
  a: 商品頁會顯示補貨中,可以先登記到貨通知。補貨時間依供應商而定,我們無法給確切日期。
- q: 可以改收件地址嗎
  a: 還沒出貨可以改,來信附上訂單編號即可。已經出貨就要等包裹退回後重寄。
- q: 收到的商品破損怎麼辦
  a: 請在收到當天拍下外箱與商品的照片來信,我們會安排換貨或退款,這種情況的運費由我們負擔。
- q: 超過七天才發現瑕疵怎麼辦
  a: 超過七天才發現商品有瑕疵,一樣可以依民法的瑕疵擔保規定要求換貨、減價或退貨,發現後請盡快來信。我們確認狀況後會跟您說明處理方式。
- q: 商品標錯價怎麼辦
  a: 商品頁的價格屬於交易內容的一部分,萬一標錯價,能不能照標示的價格出貨要看個案情況。我們不會自己直接取消訂單,會先聯絡您說明。
- q: 怎麼查包裹到哪了
  a: 出貨當天會寄出含物流單號的通知信,到物流業者的官網輸入單號就能查詢。
- q: 可以寄到海外嗎
  a: 目前只寄台灣本島與離島,離島運費另計。海外訂單暫時無法處理。
- q: 會員點數怎麼用
  a: 每消費 100 元累積 1 點,1 點折抵 1 元,結帳時勾選使用。點數自取得日起一年內有效。
- q: 換貨要另外付運費嗎
  a: 商品瑕疵或寄錯,來回運費由我們負擔。想換款式或尺寸也可以,收到商品隔天起算七天內寄回原商品不用負擔任何費用,新商品的寄送方式與運費請來信 service@example.com 確認。
- q: 對訂單或服務有意見要怎麼反映
  a: 有任何意見都可以寄信到 service@example.com,附上訂單編號會更快。我們會回覆您處理進度。
