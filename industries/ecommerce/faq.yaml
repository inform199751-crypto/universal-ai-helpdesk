- q: 下單後多久出貨
  a: 平日下午三點前下單當天寄出,之後的隔一個工作天。週六日不出貨。
- q: 運費怎麼算
  a: 滿 990 元免運,未滿收 80 元。超商取貨一律 60 元。
- q: 可以退貨嗎
  a: 收到商品七天內可退,商品要保持完整可販售狀態。
- q: 可以選超商取貨嗎
  a: 可以,結帳時選取貨門市即可。包裹到店會由超商發簡訊通知,請在七天內領取。
- q: 退款多久會到帳
  a: 退貨商品驗收無誤後三到五個工作天處理,依原付款方式退回。信用卡退刷的入帳時間由發卡銀行決定。
- q: 發票怎麼拿
  a: 一律開立電子發票,出貨後寄到您訂購時填寫的信箱。需要統編請在下單備註欄填寫。
- q: 想買的東西缺貨了怎麼辦
  a: 商品頁會顯示補貨中,可以先登記到貨通知。補貨時間依供應商而定,我們無法給確切日期。
- q: 可以改收件地址嗎
  a: 還沒出貨可以改,來信附上訂單編號即可。已經出貨就要等包裹退回後重寄。
- q: 收到的商品破損怎麼辦
  a: 請在收到當天拍下外箱與商品的照片來信,我們會安排換貨或退款,這種情況的運費由我們負擔。
- q: 怎麼查包裹到哪了
  a: 出貨當天會寄出含物流單號的通知信,到物流業者的官網輸入單號就能查詢。
- q: 可以寄到海外嗎
  a: 目前只寄台灣本島與離島,離島運費另計。海外訂單暫時無法處理。
- q: 會員點數怎麼用
  a: 每消費 100 元累積 1 點,1 點折抵 1 元,結帳時勾選使用。點數自取得日起一年內有效。
- q: 換貨要另外付運費嗎
  a: 商品瑕疵或寄錯由我們負擔來回運費。單純想換款式或尺寸,回寄運費由您負擔。
