- q: 需要預約嗎
  a: 建議先預約,現場候診時間較長。可以直接在這裡預約,也可以來電 02-8765-4321。
- q: 看診時間
  a: 上午 09:00-12:00,下午與晚上 14:00-21:00,週日休診。
- q: 可以指定醫師嗎
  a: 可以,請來電 02-8765-4321 預約並說明想看的醫師;線上預約無法指定醫師。
- q: 初診要帶什麼
  a: 請帶健保卡與身分證件,之後每次看診也都要出示健保卡;未滿 14 歲可以用戶籍資料等證明代替身分證件。若有正在服用的藥物或先前的檢查報告,也請一併帶來給醫師參考。
- q: 忘了帶健保卡怎麼辦
  a: 還是可以先看診,這次會依規定先收費並開收據。請在就診日起 10 天內(不含例假日)帶健保卡和收據回櫃檯補辦,先收的費用扣掉部分負擔後會退還給您,實際期限以櫃檯說明為準。
- q: 健保卡遺失怎麼辦
  a: 健保卡遺失不用掛失,直接向健保署申請補發,可以透過健保署的 App、網路櫃檯、郵局、戶政事務所或健保署櫃檯辦理。補發期間帶申請的收執聯(或電子收據)和身分證件,一樣可以用健保身分看診。
- q: 掛號費多少錢
  a: 掛號費沒有全國統一的金額,由各診所自訂。本診所的掛號費公告在院內明顯的地方,實際以現場公告為準。
- q: 有健保給付嗎
  a: 一般皮膚科看診依健保規定給付,部分處置屬自費項目。櫃檯會在處置前先說明費用。
- q: 看健保要付部分負擔嗎
  a: 要,看健保門診依規定要付部分負擔,藥費超過一定金額時另外還有藥品部分負擔。實際金額櫃檯收費時會說明。
- q: 哪些人可以免部分負擔
  a: 重大傷病、分娩、低收入戶等身分或情形,依健保規定可以免部分負擔。是否符合由櫃檯依健保資料確認,有相關證明請一併帶來。
- q: 自費項目大概多少錢
  a: 依項目與次數差異很大,無法在線上報價,櫃檯備有收費標準可以現場翻閱。也可以來電 02-8765-4321 詢問,或由醫師當面評估後說明。
- q: 收費會開收據嗎
  a: 會,每次收費都會開收據,列出收費項目與金額,健保和自費的部分會分開列。
- q: 醫美諮詢當天可以直接做嗎
  a: 醫美諮詢當天以說明為主,醫師會先說明處置內容與各項費用,不會當天施作。決定要做的話會簽署同意書,再另外約時間,讓您有充分時間考慮。
- q: 有停車位嗎
  a: 診所沒有專屬車位,同棟大樓的地下停車場可停,巷口也有收費停車格。
- q: 療程要間隔多久
  a: 間隔時間由醫師依您的狀況安排,通常會在看診時一併說明下次回診的時間。
- q: 可以帶小孩一起來嗎
  a: 可以,候診區有座位。看診時間較長時,建議有家人一起陪同照看。
- q: 要怎麼取消預約
  a: 請提前來電 02-8765-4321 告知。當天臨時無法前來也請務必來電,以便安排候補。
- q: 檢查報告多久出來
  a: 一般報告約三到五個工作天。報告到院後診所會通知您回診,由醫師當面說明。
- q: 藥可以請家人代領嗎
  a: 可以,請攜帶就診者的健保卡與代領人的身分證件到櫃檯辦理。
- q: 複診需要重新掛號嗎
  a: 需要,複診一樣要掛號。想排同一位醫師請來電 02-8765-4321 預約。
- q: 就診資料會保密嗎
  a: 會,您的就診與健康資料依法保密,診所人員不會無故對外透露。
