- q: 需要預約嗎
  a: 建議先預約,現場候診時間較長。預約請電 02-8765-4321。
- q: 看診時間
  a: 上午 09:00-12:00,下午與晚上 14:00-21:00,週日休診。
- q: 可以指定醫師嗎
  a: 可以,預約時說明即可。各醫師的看診時段不同,來電時會為您確認。
- q: 初診要帶什麼
  a: 健保卡與身分證件。若有正在服用的藥物或先前的檢查報告,也請一併帶來給醫師參考。
- q: 有健保給付嗎
  a: 一般皮膚科看診依健保規定給付,部分處置屬自費項目。櫃檯會在處置前先說明費用。
- q: 自費項目大概多少錢
  a: 依項目與次數差異很大,無法在線上報價。請來電 02-8765-4321 詢問,或由醫師當面評估後說明。
- q: 有停車位嗎
  a: 診所沒有專屬車位,同棟大樓的地下停車場可停,巷口也有收費停車格。
- q: 療程要間隔多久
  a: 間隔時間由醫師依您的狀況安排,通常會在看診時一併說明下次回診的時間。
- q: 可以帶小孩一起來嗎
  a: 可以,候診區有座位。看診時間較長時,建議有家人一起陪同照看。
- q: 要怎麼取消預約
  a: 請提前來電 02-8765-4321 告知。當天臨時無法前來也請務必來電,以便安排候補。
- q: 檢查報告多久出來
  a: 一般報告約三到五個工作天。報告到院後診所會通知您回診,由醫師當面說明。
- q: 藥可以請家人代領嗎
  a: 可以,請攜帶就診者的健保卡與代領人的身分證件到櫃檯辦理。
- q: 複診需要重新掛號嗎
  a: 需要,複診一樣要掛號。預約時說明是複診,櫃檯會幫您安排同一位醫師的時段。
