# 預約設定(選填)。一次一位病人,所以 max_party 是 1(不問人數)。
# 時段一定要加引號 —— 沒加的 10:30 會被 YAML 當成 60 進位整數 630(規則 11 會擋)。
# 0 開頭的 09:30 剛好不會被轉,但別依賴這個。
label: 預約
days: [一, 二, 三, 四, 五, 六]
times: ["09:30", "10:30", "14:30", "15:30"]
capacity: 3
max_party: 1
advance_days: 14
fields:
  - key: service
    label: 看診項目
    options: [一般皮膚, 青春痘, 醫美諮詢]
