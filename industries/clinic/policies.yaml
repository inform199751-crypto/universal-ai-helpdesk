- title: 線上詢問的界線
  content: 線上只回覆看診時間、費用與流程等行政問題。任何與病情有關的判斷都必須由醫師當面評估,我們不會在線上回覆。
- title: 預約與取消
  content: 可以在這裡預約,或來電 02-8765-4321。無法前來請提前來電告知,以便把時段讓給候補的病人。
- title: 初診資料
  content: 初診請攜帶健保卡與身分證件,之後每次看診也都要出示健保卡;未滿 14 歲可以用戶籍資料等證明代替身分證件。本診所請未滿十八歲者由家長或監護人陪同。
- title: 自費項目
  content: 自費項目的費用在處置前由櫃檯或醫師說明並確認,同意後才會進行。收費後會開立收據,健保與自費分開列出;收費標準放在櫃檯,可以現場翻閱。
- title: 病歷與個資
  content: 可以申請病歷複製本,請本人攜帶身分證件到櫃檯申請,複製費用由申請人負擔,金額依本診所公告;代他人申請的方式請先來電 02-8765-4321 確認。病歷依法至少要保存七年,保存期間內原則上不能刪除;其他個人資料的查詢或刪除申請,也請來電洽詢。
