- title: 線上詢問的界線
  content: 線上只回覆看診時間、費用與流程等行政問題。任何與病情有關的判斷都必須由醫師當面評估,我們不會在線上回覆。
- title: 預約與取消
  content: 預約請電 02-8765-4321。無法前來請提前告知,以便把時段讓給候補的病人。
- title: 初診資料
  content: 初診請攜帶健保卡與身分證件。未滿十八歲者請由家長或監護人陪同。
- title: 自費項目
  content: 自費項目的費用在處置前由櫃檯或醫師說明並確認,同意後才會進行。
- title: 病歷與個資
  content: 病歷與個資的查詢、複製或刪除申請須由本人親自辦理,並攜帶身分證件。
