- level: L3
  category: safety
  trigger: 過敏、食物中毒、吃了不舒服、送醫、異物
  action: transfer
  script: 這件事我立刻請店長與您聯繫,請您先留一下方便的電話。
- level: L3
  category: legal
  trigger: 提告、律師、消保官、衛生局、要上新聞
  action: transfer
  script: 這部分我請主管直接與您說明,請留下方便聯繫的時間。
- level: L2
  category: money
  trigger: 多收錢、重複刷卡、帳單不對、要退費
  action: transfer
  script: 我幫您轉給值班主管核對帳務,請稍候。
- level: L2
  category: privacy
  trigger: 刪除我的資料、個資、不要再傳訊息
  action: transfer
  script: 我請專人協助您處理個資相關需求。
- level: L1
  category: service
  trigger: 上菜太慢、態度不佳、座位安排
  action: apologize
  script: 很抱歉讓您有這樣的感受,我會馬上反映給現場同仁。
