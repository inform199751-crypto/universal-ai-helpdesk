- q: 可以訂位嗎
  a: 可以,用電話 02-2345-6789 訂位。六人以上建議提前三天。
- q: 有低消嗎
  a: 平日每位 350 元,假日每位 450 元,不含一成服務費。
- q: 有停車位嗎
  a: 店門口有兩格,滿了的話對面有收費停車場,步行約兩分鐘。
- q: 可以帶寵物嗎
  a: 戶外座位可以,室內因應食品衛生規定不行,導盲犬不在此限。
- q: 可以包場嗎
  a: 可以,平日晚間或整天包場皆可洽詢,場地費另計,依人數與時段報價,建議提前兩週聯繫確認。
- q: 有素食可以選嗎
  a: 有蛋奶素套餐可選,全素請於訂位時先告知,廚房會另外調整,但無法完全排除同鍋具接觸葷食。
- q: 可以帶小孩嗎
  a: 歡迎攜帶,店內有兩張兒童椅,晚間九點後現場氣氛偏安靜,建議斟酌孩子的作息安排時間。
- q: 可以刷卡嗎
  a: 可以,接受各大信用卡與感應支付,行動支付的紅利折抵無法使用,單筆金額不限。
- q: 可以外帶嗎
  a: 主餐與部分甜點可外帶,湯品與現烤麵包不提供外帶,外帶不收一成服務費。
- q: 服務費怎麼計算
  a: 內用酌收一成服務費,外帶及外送不收,帳單上會另列一行,不會併入餐點單價。
- q: 用餐時間有限制嗎
  a: 假日晚餐時段每桌用餐時間約兩小時,平日沒有限制,若後面已有其他訂位,服務人員會提前告知。
- q: 店內有 Wifi 嗎
  a: 有免費 Wifi,密碼印在餐墊紙背面,戶外座位區的訊號會比較弱。
