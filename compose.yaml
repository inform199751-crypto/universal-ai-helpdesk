name: helpdesk

services:
  db:
    # 主版本釘死,不准寫 latest。資料目錄格式跟主版本綁定 —— 映像跳版會
    # 對著既有的 pgdata volume 直接啟動失敗,而錯誤訊息講的是資料目錄
    # 版本不符,不會說「你換了映像」。要升級請有意識地跑 pg_upgrade。
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env 設 POSTGRES_PASSWORD}
      POSTGRES_DB: helpdesk
    ports:
      # 只給 127.0.0.1。Task 5 的搬遷腳本跑在主機上(來源那個 SQLite 檔
      # 被 .dockerignore 擋掉了,不在映像裡),沒有這行它連不進來。
      # 平常用 psql 看一眼資料也靠它。絕對不要改成 0.0.0.0 ——
      # 那等於把資料庫端口開給同網段的所有人。
      #
      # 主機側用 15432 而不是 5432:開發機上 5432 幾乎一定已經有人了
      # (這台就有一個 Automatic 啟動的原生 postgresql-x64-18 服務佔著)。
      # 要求開發者停掉系統服務來讓路是錯的方向 —— 那個服務可能是別的
      # 專案在用。容器之間仍然走 db:5432,所以這個數字只影響「從主機連進來」。
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    depends_on:
      # 沒有這個,開機第一件事 alembic upgrade head 會在 PostgreSQL 還沒
      # ready 時失敗。restart policy 會一直重試直到成功,但 log 會塞滿
      # 指不到真正原因的錯誤。
      db:
        condition: service_healthy
    environment:
      # 容器裡連的是服務名 db,不是 localhost
      DATABASE_URL: postgresql+psycopg://helpdesk:${POSTGRES_PASSWORD:?}@db:5432/helpdesk
      FERNET_KEY: ${FERNET_KEY:?請在 .env 設 FERNET_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?請在 .env 設 OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      OPENROUTER_FALLBACK_MODEL: ${OPENROUTER_FALLBACK_MODEL:-openrouter/free}
    ports:
      # 只綁 127.0.0.1。綁 0.0.0.0 的話,同網段的人(會議室 Wi-Fi)
      # 直接打得到 webhook 端點。容器內部仍然聽 0.0.0.0 —— 那是必要的,
      # 不然這個 port publish 轉不進去。兩件事不一樣。
      #
      # 主機側用 18000 而不是 8000:`scripts/dev.py` 的筆電開發流程綁的就是
      # 8000,而那條路是刻意保留的(見第八節「檔案清單」)。兩條路都要 8000
      # 的話就是永久打架,症狀是 `docker compose up` 回一句 port is already
      # allocated —— 那句話不會告訴你是自己的 dev server 在佔。
      # 容器內部與 ngrok 都走 app:8000,不受這個數字影響。
      - "127.0.0.1:18000:8000"
    healthcheck:
      # 注意:healthcheck 不會重啟容器(那是 Swarm 的行為)。它的用途是
      # 讓 docker compose ps 看得出狀態,以及給別的服務 depends_on 等。
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  ngrok:
    # 原本用 Tailscale Funnel 提供固定網址(Task 6 驗收全過:網址固定、
    # down/up 不變、外網 curl 200)。但手機實測「已讀不回」—— 系統化除錯
    # 之後發現:LINE 的 TLS 客戶端跟 Funnel 談判到一半就自己斷線。
    # `docker compose logs tailscale` 是 `TLS handshake error ... EOF`,
    # LINE 官方 webhook 測試端點回的是 `Session protocol negotiation
    # failure`(statusCode: 0)。我們這端每一項都健康 —— TLS 1.2/1.3、
    # ALPN h2 與 http/1.1、憑證驗證都過,外網 curl 200,自己 POST 進去拿到
    # 401 bad signature(證明整條鏈是活的)。同一個網址,curl / Python /
    # 瀏覽器全部成功,只有 LINE 不行。完整除錯過程與教訓見
    # docs/report.md 第七節。
    #
    # LINE 是這個系統唯一重要的客戶端,打不進來等於白搭,所以整個換成
    # ngrok 固定網域當對外入口。Tailscale 服務、deploy/funnel.json、
    # ts-state volume 已經拆掉(Task 8,2026-09-24)——LINE 官方測試端點對
    # 這個網址回 success: true,手機也已實測通過,沒有理由再留著兩套入口。
    #
    # 不需要 state volume。固定網域(unsaid-expend-eagle.ngrok-free.dev)是
    # 綁在 ngrok 帳號上,不是綁在節點身分上,容器重建不會換網址 —— 拆掉的
    # Tailscale 那個「volume 是網址命脈、沒掛就換名字」的整類風險在這裡
    # 不存在。
    #
    # 免費層有硬上限:20,000 requests/月、1GB/月(見
    # https://ngrok.com/docs/pricing-limits/free-plan-limits)。demo 與
    # 個人使用不會碰到,但這是限制,不是「沒有上限」,寫進 README 與
    # report 的限制清單。
    image: ngrok/ngrok:latest
    # --log=stdout:ngrok agent 的 --log 預設是 "false"(完全不輸出),不加
    # 這行 `docker compose logs ngrok` 永遠是空的 —— 連「有沒有連上」都看不
    # 出來,出事時也沒有 log 可以排查。
    command: ["http", "app:8000", "--url=https://unsaid-expend-eagle.ngrok-free.dev", "--log=stdout"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?請在 .env 設 NGROK_AUTHTOKEN}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
