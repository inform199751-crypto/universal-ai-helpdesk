name: helpdesk

services:
  db:
    # 主版本釘死,不准寫 latest。資料目錄格式跟主版本綁定 —— 映像跳版會
    # 對著既有的 pgdata volume 直接啟動失敗,而錯誤訊息講的是資料目錄
    # 版本不符,不會說「你換了映像」。要升級請有意識地跑 pg_upgrade。
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env 設 POSTGRES_PASSWORD}
      POSTGRES_DB: helpdesk
    ports:
      # 只給 127.0.0.1。Task 5 的搬遷腳本跑在主機上(來源那個 SQLite 檔
      # 被 .dockerignore 擋掉了,不在映像裡),沒有這行它連不進來。
      # 平常用 psql 看一眼資料也靠它。絕對不要改成 0.0.0.0 ——
      # 那等於把資料庫端口開給同網段的所有人。
      #
      # 主機側用 15432 而不是 5432:開發機上 5432 幾乎一定已經有人了
      # (這台就有一個 Automatic 啟動的原生 postgresql-x64-18 服務佔著)。
      # 要求開發者停掉系統服務來讓路是錯的方向 —— 那個服務可能是別的
      # 專案在用。容器之間仍然走 db:5432,所以這個數字只影響「從主機連進來」。
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    depends_on:
      # 沒有這個,開機第一件事 alembic upgrade head 會在 PostgreSQL 還沒
      # ready 時失敗。restart policy 會一直重試直到成功,但 log 會塞滿
      # 指不到真正原因的錯誤。
      db:
        condition: service_healthy
    environment:
      # 容器裡連的是服務名 db,不是 localhost
      DATABASE_URL: postgresql+psycopg://helpdesk:${POSTGRES_PASSWORD:?}@db:5432/helpdesk
      FERNET_KEY: ${FERNET_KEY:?請在 .env 設 FERNET_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?請在 .env 設 OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      OPENROUTER_FALLBACK_MODEL: ${OPENROUTER_FALLBACK_MODEL:-openrouter/free}
    ports:
      # 只綁 127.0.0.1。綁 0.0.0.0 的話,同網段的人(會議室 Wi-Fi)
      # 直接打得到 webhook 端點。容器內部仍然聽 0.0.0.0 —— 那是必要的,
      # 不然這個 port publish 轉不進去。兩件事不一樣。
      #
      # 主機側用 18000 而不是 8000:`scripts/dev.py` 的筆電開發流程綁的就是
      # 8000,而那條路是刻意保留的(見第八節「檔案清單」)。兩條路都要 8000
      # 的話就是永久打架,症狀是 `docker compose up` 回一句 port is already
      # allocated —— 那句話不會告訴你是自己的 dev server 在佔。
      # 容器內部與 Task 6 的 funnel 都走 app:8000,不受這個數字影響。
      - "127.0.0.1:18000:8000"
    healthcheck:
      # 注意:healthcheck 不會重啟容器(那是 Swarm 的行為)。它的用途是
      # 讓 docker compose ps 看得出狀態,以及給別的服務 depends_on 等。
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:latest
    # 這個名字是網址的前半段:https://helpdesk.<tailnet>.ts.net
    hostname: helpdesk
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?請在 .env 設 TS_AUTHKEY(必須帶 tag:helpdesk)}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/funnel.json
      # 標記過的節點不適用金鑰到期。沒有這行,180 天後某一天服務會自己
      # 斷線,而且那天你什麼都沒改,完全不會往這裡想。
      TS_EXTRA_ARGS: --advertise-tags=tag:helpdesk
      # 先試 userspace(零特權)。不通再照 Step 7 換 kernel 模式。
      TS_USERSPACE: "true"
    volumes:
      # 這個 volume 是網址的命脈。沒掛的話容器一重建就當成新機器註冊,
      # 而舊節點還在 tailnet 裡佔著 helpdesk 這個名字,新的會拿到
      # helpdesk-1 —— 網址變了,LINE 那邊還指著舊的,症狀是訊息傳出去
      # 沒人回,而 Console 看起來一切正常。
      - ts-state:/var/lib/tailscale
      - ./deploy/funnel.json:/config/funnel.json:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  ts-state:
